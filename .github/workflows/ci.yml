name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  agent:
    name: Agent (vet, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: |
          gofmt -d agent
          test -z "$(gofmt -l agent)"
      - name: go.mod and go.sum are tidy
        working-directory: agent
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet and test
        run: make test
      - name: Vet for a non-Linux build
        working-directory: agent
        run: GOOS=darwin go vet ./...

  e2e:
    name: End to end (load probes, expect alerts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum
      - name: Install clang and the libbpf headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev
      # Compiles the eBPF object, loads the six programs into the runner's kernel, attaches
      # them, makes a handful of harmless syscalls and fails unless the matching alerts come
      # out of the agent.
      - name: Smoke test
        run: make e2e

  dashboard:
    name: Dashboard (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm ci
      - name: Lint
        working-directory: dashboard
        run: npm run lint
      - name: Build
        working-directory: dashboard
        run: npm run build

  chart:
    name: Helm chart renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render
        run: |
          helm lint deploy/helm
          helm template demo deploy/helm > rendered.yaml
      # The alert stream must stay on loopback: the chart may not set a listen address.
      - name: Chart does not expose the alert stream
        run: |
          if grep -n "LISTEN_ADDR" rendered.yaml | grep -v "^[0-9]*: *#"; then
            echo "::error::the chart sets LISTEN_ADDR"
            exit 1
          fi
