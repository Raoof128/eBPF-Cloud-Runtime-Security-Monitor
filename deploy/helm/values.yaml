# Placeholders. No image is published for this project and the repository has no Dockerfile.
image:
  agent: ghcr.io/example/runtime-agent:latest
  dashboard: ghcr.io/example/runtime-dashboard:latest

resources:
  agent:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  dashboard:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

service:
  type: ClusterIP
  port: 8080

# The agent does not call the Kubernetes API, so the account gets no role and no token.
serviceAccount:
  create: true


# The alert stream is not exposed. The agent listens on 127.0.0.1 inside its pod and the
# chart creates no Service or NetworkPolicy for it; alerts are read from the agent's log
# (stdout). The dashboard Deployment therefore has nothing to connect to in a cluster. To
# expose the stream you would set LISTEN_ADDR and EVENTS_TOKEN on the agent (it refuses a
# non-loopback address without a token), keep the token in a Secret, and add a NetworkPolicy
# that admits only the client. None of that is in this chart.
