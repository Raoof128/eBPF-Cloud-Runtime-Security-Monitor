# Placeholders. No image is published for this project and the repository has no Dockerfile.
image:
  agent: ghcr.io/example/runtime-agent:latest
  dashboard: ghcr.io/example/runtime-dashboard:latest

resources:
  agent:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  dashboard:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

service:
  type: ClusterIP
  port: 8080

# The agent does not call the Kubernetes API, so the account gets no role and no token.
serviceAccount:
  create: true
